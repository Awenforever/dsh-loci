name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: install
        run: npm ci --no-audit --no-fund
      - name: manifest and syntax gate
        run: node scripts/check-manifest.mjs
      - name: unit and integration tests
        run: node --disable-warning=ExperimentalWarning --test "test/unit/*.test.mjs" "test/integration/*.test.mjs"
      - name: coverage threshold
        run: node --disable-warning=ExperimentalWarning scripts/check-coverage.mjs
      - name: retrieval benchmark (short)
        run: node --disable-warning=ExperimentalWarning scripts/bench.mjs --entries 2000 --queries 100

  package:
    name: pack and inspect
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --no-audit --no-fund
      - name: pack
        run: npm pack
      - name: the tarball must carry the client, the schema, the locale and the icon
        shell: bash
        run: |
          set -euo pipefail
          tar -tzf dsh-loci-*.tgz > files.txt
          for required in package/index.js package/client.js package/cordis.patch.yml package/icon.svg package/locale/en.json package/src/host/store/store.js; do
            grep -qx "$required" files.txt || { echo "missing $required"; exit 1; }
          done
          echo "pack contents ok ($(wc -l < files.txt) entries)"

      # The bin entry ships with the package but nothing used to prove it runs
      # after an install: a broken `files` list or a bad shebang would only show
      # up in a user's terminal.
      - name: install the tarball and run its bin
        shell: bash
        run: |
          set -euo pipefail
          tarball="$(ls "$PWD"/dsh-loci-*.tgz)"
          mkdir -p /tmp/loci-smoke
          cd /tmp/loci-smoke
          npm init -y > /dev/null 2>&1
          npm install --no-audit --no-fund "$tarball"
          npx --no-install dsh-loci doctor --home /tmp/loci-smoke-home

      # `engines.dsh` is a range; a range is a promise nobody tested. When a Host is
      # actually installed on the runner, read it out of its app.asar and assert that
      # the API surface this plugin depends on is still there. A stock GitHub runner
      # has no Host (it is not published to npm), so this skips loudly rather than
      # failing a build for a missing environment.
      - name: host API surface (runs only where a Host is installed)
        shell: bash
        run: |
          set -euo pipefail
          archive=""
          for candidate in "$DSH_ASAR" "/opt/deepseek-harness/resources/app.asar" "$HOME/.local/share/deepseek-harness/resources/app.asar"; do
            if [ -n "$candidate" ] && [ -f "$candidate" ]; then archive="$candidate"; break; fi
          done
          if [ -z "$archive" ]; then
            echo "::notice::no Host install on this runner; compat probe skipped (run it locally with --asar)"
            exit 0
          fi
          node scripts/compat-probe.mjs --asar "$archive"