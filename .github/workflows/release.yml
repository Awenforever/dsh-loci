name: release

# Publishing is deliberately a manual, tag-driven action: pushing a `vX.Y.Z` tag
# is the only trigger. The credential is the OIDC identity token from
# `id-token: write` plus a Trusted Publisher binding on npmjs.com — there is no
# npm secret in this repository (collaboration center AGENTS.md K21 / §15).
#
# Guards added after the release audit:
#   - the tag must be an ancestor of main (a tag on a side branch cannot publish);
#   - a prerelease (`v1.2.3-rc.1`) publishes to the `next` dist-tag, so it can
#     never become `latest` by accident;
#   - the install is `npm ci` from the committed lockfile;
#   - the tag/version equality check runs before anything is published.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history is required for the ancestry check below.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          # Deliberately NO `registry-url`: that option writes
          # `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}` into .npmrc, and
          # an empty value makes npm fall back to token auth instead of the OIDC
          # exchange — the exact `ENEEDAUTH` trap recorded in the collaboration
          # center's npm runbook (§15.3).

      - name: npm must be new enough to attempt the OIDC exchange
        shell: bash
        run: |
          set -euo pipefail
          version="$(npm --version)"
          echo "npm $version"
          # npm 10 never performs the exchange; trusted publishing needs >= 11.5.
          node -e 'const [a,b]=process.argv[1].split(".").map(Number); process.exit(a>11 || (a===11 && b>=5) ? 0 : 1)' "$version" \
            || { echo "npm $version is too old for trusted publishing (need >= 11.5)"; exit 1; }

      - name: the tag must be on main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "tag $GITHUB_REF_NAME points at $GITHUB_SHA, which is not on main"
            exit 1
          fi

      - name: tag must match package.json version
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          tag="${GITHUB_REF_NAME#v}"
          test "$version" = "$tag" || { echo "tag $tag does not match package version $version"; exit 1; }

      - run: npm ci --no-audit --no-fund
      - run: node scripts/check-manifest.mjs
      - run: node --disable-warning=ExperimentalWarning --test "test/unit/*.test.mjs" "test/integration/*.test.mjs"
      - run: node --disable-warning=ExperimentalWarning scripts/check-coverage.mjs
      - name: decide the dist-tag
        id: dist
        shell: bash
        run: |
          set -euo pipefail
          # 1.2.3-rc.1 -> next ; 1.2.3 -> latest
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            echo "tag=next" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi

      # Trusted publishing: no secret is referenced here on purpose. The OIDC
      # identity token from `id-token: write` is the credential, so there is no
      # long-lived npm token to leak, rotate, or forget (collaboration center
      # AGENTS.md K21). If the binding on npmjs.com is missing, this step fails
      # with ENEEDAUTH and the fix is to create the Trusted Publisher, not to add
      # a secret.
      - name: publish with provenance
        run: npm publish --provenance --access public --tag "${{ steps.dist.outputs.tag }}"
