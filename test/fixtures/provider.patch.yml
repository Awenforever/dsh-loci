# Model route used by the isolated test profiles.
#
# The acceptance and lifecycle runs need a working provider, and the shipped
# profile templates do not pin one. This patch pins the USTC gateway used on this
# machine; replace provider/model/key-env for another environment.
#
# The key itself never lands here: `apiKeyEnv` names an environment variable that
# the runner exports for the child process only.
- id: agent-default-model
  name: "@deepseek-ai/dsh-agent-default-model"
  config:
    provider: local-test
    model: deepseek-flash
    reasoningEffort: off
- id: llm-pi-ai
  name: "@deepseek-ai/dsh-llm-pi-ai"
  config:
    providers:
      local-test:
        displayName: lja
        apiKeyEnv: USTC_LJA_API_KEY
        api: openai-completions
        baseURL: https://api.llm.ustc.edu.cn/
        models:
          - id: deepseek-flash
            name: deepseek-flash
            contextWindow: 100000
            maxTokens: 8192
            reasoningEfforts:
              off: none
              low: low
              high: high
              max: max
            input:
              - text
